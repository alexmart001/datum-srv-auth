server:
  port: 9000
spring:
  application:
    name: datum-srv-auth
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/datum_db?useTimezone=true&serverTimezone=UTC
    username: ${DB_USERNAME:user_datum}
    password: ${DB_PASSWORD:C0ntrol3Xyz21}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false
    open-in-view: false

datum:
  auth:
    issuer: http://${AUTH_HOST:localhost}:${AUTH_PORT:9000}
    client-id: postman-client
    client-secret: postman-secret
